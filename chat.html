<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CPV PRIVATE CHAT</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #000;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .chat-container {
      width: 100%;
      max-width: 430px;
      height: 100vh;
      max-height: 750px;
      background: #111;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-header {
      padding: 18px;
      text-align: center;
      background: #181818;
      border-bottom: 1px solid #333;
    }

    .chat-header h2 {
      margin: 0;
      color: red;
      letter-spacing: 1px;
    }

    .status {
      margin-top: 6px;
      color: #4ade80;
      font-size: 13px;
    }

    .messages {
      flex: 1;
      padding: 18px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 16px;
      line-height: 1.4;
      word-wrap: break-word;
    }

    .sender-name {
      font-size: 11px;
      margin-bottom: 4px;
      opacity: 0.7;
    }

    .message-time {
      font-size: 10px;
      opacity: 0.6;
      margin-top: 5px;
      text-align: right;
    }

    .sent {
      align-self: flex-end;
      background: #d00000;
      border-bottom-right-radius: 4px;
    }

    .received {
      align-self: flex-start;
      background: #292929;
      border-bottom-left-radius: 4px;
    }

    .chat-input {
      display: flex;
      gap: 8px;
      padding: 12px;
      background: #181818;
      border-top: 1px solid #333;
    }

    .chat-input input {
      flex: 1;
      min-width: 0;
      padding: 13px;
      border: 1px solid #444;
      border-radius: 25px;
      outline: none;
      background: #252525;
      color: white;
      font-size: 15px;
    }

    .chat-input button {
      padding: 0 18px;
      border: none;
      border-radius: 25px;
      background: white;
      color: #000;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div class="chat-container">

    <div class="chat-header">
      <h2>💬 CPV PRIVATE CHAT</h2>
      <div class="status">● Online</div>
    </div>

    <div class="messages" id="messages"></div>

    <div class="chat-input">
      <input
        type="text"
        id="messageInput"
        placeholder="Type a message..."
        autocomplete="off"
      >

      <button id="sendButton">Send</button>
    </div>

  </div>

  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js";

    import {
      getDatabase,
      ref,
      push,
      onChildAdded
    } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-database.js";


    const firebaseConfig = {

      apiKey: "AIzaSyDOUfBgQbjhOy025v0CZ4CvwnYG6Y2wYBU",

      authDomain: "cpv-private-chat.firebaseapp.com",

      databaseURL:
        "https://cpv-private-chat-default-rtdb.firebaseio.com/",

      projectId: "cpv-private-chat",

      storageBucket:
        "cpv-private-chat.firebasestorage.app",

      messagingSenderId: "916226104692",

      appId:
        "1:916226104692:web:27be19c8a22df397bd6021",

      measurementId: "G-SYWN64JMNH"

    };


    const app = initializeApp(firebaseConfig);

    const database = getDatabase(app);

    const messagesRef =
      ref(database, "messages");


    let userName =
      localStorage.getItem("cpvChatName");


    if (!userName) {

      userName =
        prompt("Enter your name:");

      if (!userName ||
          userName.trim() === "") {

        userName = "Guest";

      }

      userName =
        userName.trim();

      localStorage.setItem(
        "cpvChatName",
        userName
      );

    }


    const messagesDiv =
      document.getElementById("messages");

    const input =
      document.getElementById("messageInput");

    const sendButton =
      document.getElementById("sendButton");


    async function sendMessage() {
  const text = input.value.trim();

  if (text === "") {
    return;
  }

  if (!auth.currentUser) {
    alert("Not connected to Firebase yet.");
    return;
  }

  try {
    await push(messagesRef, {
      name: userName,
      text: text,
      timestamp: Date.now(),
      userId: auth.currentUser.uid
    });

    input.value = "";
    input.focus();

  } catch (error) {
    console.error(error);
    alert("Message failed: " + error.message);
  }
}

      const text =
        input.value.trim();

      if (text === "") {
        return;
      }


      push(messagesRef, {

        name: userName,

        text: text,

        timestamp: Date.now()

      });


      input.value = "";

      input.focus();

    }


    sendButton.addEventListener(
      "click",
      sendMessage
    );


    input.addEventListener(
      "keydown",
      function(event) {

        if (event.key === "Enter") {

          sendMessage();

        }

      }
    );


    onChildAdded(
      messagesRef,
      function(snapshot) {

        const message =
          snapshot.val();


        const messageElement =
          document.createElement("div");


        if (message.name === userName) {

          messageElement.className =
            "message sent";

        } else {

          messageElement.className =
            "message received";

        }


        const nameElement =
          document.createElement("div");

        nameElement.className =
          "sender-name";

        nameElement.textContent =
          message.name || "Guest";


        const textElement =
          document.createElement("div");

        textElement.textContent =
          message.text;


        const timeElement =
          document.createElement("div");

        timeElement.className =
          "message-time";


        if (message.timestamp) {

          const date =
            new Date(message.timestamp);

          timeElement.textContent =
            date.toLocaleTimeString([], {
              hour: "numeric",
              minute: "2-digit"
            });

        }


        messageElement.appendChild(
          nameElement
        );

        messageElement.appendChild(
          textElement
        );

        messageElement.appendChild(
          timeElement
        );


        messagesDiv.appendChild(
          messageElement
        );


        messagesDiv.scrollTop =
          messagesDiv.scrollHeight;

      }
    );

  </script>

</body>
</html>
