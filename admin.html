<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CPV ADMIN CHAT</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #000;
      color: white;
      font-family: Arial, sans-serif;
    }

    .header {
      padding: 18px;
      text-align: center;
      background: #181818;
      border-bottom: 1px solid #333;
    }

    .header h2 {
      margin: 0;
      color: red;
    }

    .status {
      margin-top: 6px;
      color: #4ade80;
      font-size: 13px;
    }

    .back {
      display: none;
      margin-top: 12px;
      padding: 9px 16px;
      border: none;
      border-radius: 20px;
      background: white;
      color: black;
      font-weight: bold;
      cursor: pointer;
    }

    .inbox {
      max-width: 600px;
      margin: auto;
    }

    .guest {
      padding: 17px;
      border-bottom: 1px solid #292929;
      background: #111;
      cursor: pointer;
    }

    .guest:active {
      background: #222;
    }

    .guest-name {
      color: white;
      font-size: 17px;
      font-weight: bold;
    }

    .preview {
      color: #aaa;
      margin-top: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .guest-time {
      color: #777;
      font-size: 11px;
      margin-top: 5px;
    }

   .conversation {
  display: none;
  max-width: 600px;
  margin: auto;
  padding: 18px;
}

#conversationMessages {
  display: flex;
  flex-direction: column;
}

    .conversation-title {
      padding: 12px 0;
      font-size: 18px;
      font-weight: bold;
      color: #ff3333;
    }

  .message {
  max-width: 80%;
  background: #191919;
  border: 1px solid #333;
  border-radius: 14px;
  padding: 10px 14px;
  margin-bottom: 10px;
  align-self: flex-start;
}

.admin-message {
  margin-left: auto;
  background: #d00000;
  border-color: #d00000;
}

.guest-message {
  margin-right: auto;
}

    .name {
      color: #ff3333;
      font-weight: bold;
    }

    .guest-id {
      color: #777;
      font-size: 10px;
      margin-top: 3px;
    }

    .time {
      color: #888;
      font-size: 11px;
      margin-top: 6px;
    }

    .text {
      margin-top: 8px;
      font-size: 15px;
      word-wrap: break-word;
    }

    .empty {
      padding: 25px;
      text-align: center;
      color: #777;
    }

    .error {
      color: #ff5555;
      padding: 20px;
    }
    .reply-box {
  display: flex;
  gap: 8px;
  padding: 12px 0;
  position: sticky;
  bottom: 0;
  background: #000;
}

.reply-box input {
  flex: 1;
  min-width: 0;
  padding: 13px;
  border: 1px solid #444;
  border-radius: 25px;
  outline: none;
  background: #252525;
  color: white;
  font-size: 15px;
}

.reply-box button {
  padding: 0 18px;
  border: none;
  border-radius: 25px;
  background: white;
  color: black;
  font-weight: bold;
  cursor: pointer;
}

.reply-box button:active {
  transform: scale(0.96);
}
  </style>
</head>

<body>

  <div class="header">

    <h2>🔐 CPV ADMIN CHAT</h2>

    <div class="status" id="status">
      ● Connecting...
    </div>

    <button
      class="back"
      id="backButton">
      ← Back to Guests
    </button>

  </div>

  <div
    class="inbox"
    id="inbox">
  </div>

  <div
  class="conversation"
  id="conversation">

  <div id="conversationMessages"></div>

  <div class="reply-box">

  <input
    type="file"
    id="imageInput"
    accept="image/*"
    style="display:none"
  >

  <button
    id="imageButton"
    type="button">
    📷
  </button>

  <input
    type="text"
    id="replyInput"
    placeholder="Type a reply..."
    autocomplete="off"
  >

  <button
    id="replyButton"
    type="button">
    Send
  </button>

</div>

</div>

  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js";

    import {
      getDatabase,
      ref,
      onValue
    } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-database.js";

    import {
      getAuth,
      signInWithEmailAndPassword
    } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js";


    const firebaseConfig = {

      apiKey:
        "AIzaSyDOUfBgQbjhOy025v0CZ4CvwnYG6Y2wYBU",

      authDomain:
        "cpv-private-chat.firebaseapp.com",

      databaseURL:
        "https://cpv-private-chat-default-rtdb.firebaseio.com/",

      projectId:
        "cpv-private-chat",

      storageBucket:
        "cpv-private-chat.firebasestorage.app",

      messagingSenderId:
        "916226104692",

      appId:
        "1:916226104692:web:27be19c8a22df397bd6021",

      measurementId:
        "G-SYWN64JMNH"
    };


    const app =
      initializeApp(firebaseConfig);

    const auth =
      getAuth(app);

    const database =
      getDatabase(app);


    const inbox =
      document.getElementById("inbox");

    const conversation =
      document.getElementById("conversation");
const conversationMessages =
  document.getElementById("conversationMessages");
    const status =
      document.getElementById("status");

    const backButton =
      document.getElementById("backButton");


    /*
      ADMIN LOGIN
    */

    try {

      await signInWithEmailAndPassword(
        auth,
        "damilareobidairo@gmail.com",
        "Damkidob"
      );

      status.textContent =
        "● Admin online";

    } catch (error) {

      console.error(
        "Admin login error:",
        error
      );

      status.textContent =
        "● Admin login failed";

      inbox.innerHTML =
        "<div class='error'>" +
        "ADMIN ERROR: " +
        error.message +
        "</div>";

      throw error;
    }


    /*
      READ ALL GUEST ROOMS
    */

    const privateMessagesRef =
      ref(
        database,
        "privateMessages"
      );


    let allRooms = {};
let selectedGuestId = null;

const replyInput =
  document.getElementById("replyInput");

const replyButton =
  document.getElementById("replyButton");
const imageInput =
  document.getElementById("imageInput");

const imageButton =
  document.getElementById("imageButton");

imageButton.addEventListener(
  "click",
  function() {
    imageInput.click();
  }
);

async function sendReply() {

  const text =
    replyInput.value.trim();

  if (!text || !selectedGuestId) {
    return;
  }

  try {

    const guestMessagesRef =
      ref(
        database,
        "privateMessages/" +
        selectedGuestId
      );

    const { push } =
      await import(
        "https://www.gstatic.com/firebasejs/12.5.0/firebase-database.js"
      );

    await push(
      guestMessagesRef,
      {
        name: "Admin",
        text: text,
        timestamp: Date.now()
      }
    );

    replyInput.value = "";
    replyInput.focus();

  } catch (error) {

    console.error(
      "Reply error:",
      error
    );

    alert(
      "Reply failed: " +
      error.message
    );
  }
}


replyButton.addEventListener(
  "click",
  sendReply
);
imageInput.addEventListener(
  "change",
  function() {

    const file = imageInput.files[0];

    if (!file) {
      return;
    }

    if (!file.type.startsWith("image/")) {
      alert("Please select a picture.");
      return;
    }

    if (!selectedGuestId) {
      alert("Please open a guest conversation first.");
      imageInput.value = "";
      return;
    }

    const reader = new FileReader();

    reader.onload = function(event) {

      const image = new Image();

      image.onload = async function() {

        const canvas =
          document.createElement("canvas");

        const maxWidth = 600;
        const maxHeight = 600;

        let width = image.width;
        let height = image.height;

        if (width > maxWidth) {
          height =
            height * (maxWidth / width);

          width = maxWidth;
        }

        if (height > maxHeight) {
          width =
            width * (maxHeight / height);

          height = maxHeight;
        }

        canvas.width = width;
        canvas.height = height;

        const ctx =
          canvas.getContext("2d");

        ctx.drawImage(
          image,
          0,
          0,
          width,
          height
        );

        const imageData =
          canvas.toDataURL(
            "image/jpeg",
            0.5
          );

        try {

          const guestMessagesRef =
            ref(
              database,
              "privateMessages/" +
              selectedGuestId
            );

          const { push } =
            await import(
              "https://www.gstatic.com/firebasejs/12.5.0/firebase-database.js"
            );

          await push(
            guestMessagesRef,
            {
              name: "Admin",
              image: imageData,
              timestamp: Date.now()
            }
          );

          imageInput.value = "";

        } catch (error) {

          console.error(
            "Image send error:",
            error
          );

          alert(
            "Picture failed: " +
            error.message
          );
        }
      };

      image.src = event.target.result;
    };

    reader.readAsDataURL(file);

  }
);

replyInput.addEventListener(
  "keydown",
  function(event) {

    if (event.key === "Enter") {

      event.preventDefault();

      sendReply();

    }

  }
);

    onValue(
  privateMessagesRef,
  function(snapshot) {

    allRooms =
      snapshot.val() || {};

    if (selectedGuestId) {
      openConversation(selectedGuestId);
    } else {
      showInbox();
    }

  },
);
      function(error) {

        console.error(
          "Database error:",
          error
        );

        status.textContent =
          "● Database error";

        inbox.innerHTML =
          "<div class='error'>" +
          "DATABASE ERROR: " +
          error.message +
          "</div>";
      }
    );


    /*
      SHOW GUEST LIST
    */

    function showInbox() {

      inbox.style.display =
        "block";

      conversation.style.display =
        "none";

      backButton.style.display =
        "none";

      inbox.innerHTML = "";


      const guestIds =
        Object.keys(allRooms);


      if (guestIds.length === 0) {

        inbox.innerHTML =
          "<div class='empty'>" +
          "No guest messages yet." +
          "</div>";

        return;
      }


      guestIds.forEach(
        function(userId) {

          const userMessages =
            allRooms[userId];

          if (!userMessages) {
            return;
          }


          const messages =
            Object.values(userMessages)
              .filter(
                message => message
              )
              .sort(
                (a, b) =>
                  (a.timestamp || 0) -
                  (b.timestamp || 0)
              );


          if (messages.length === 0) {
            return;
          }


          const lastMessage =
            messages[messages.length - 1];


          const guest =
            document.createElement("div");

          guest.className =
            "guest";


          const name =
            document.createElement("div");

          name.className =
            "guest-name";

          name.textContent =
            lastMessage.name ||
            "Guest";


          const preview =
            document.createElement("div");

          preview.className =
            "preview";

          preview.textContent =
            lastMessage.text ||
            "No message";


          const time =
            document.createElement("div");

          time.className =
            "guest-time";


          if (lastMessage.timestamp) {

            time.textContent =
              new Date(
                lastMessage.timestamp
              ).toLocaleString();

          }


          guest.appendChild(name);
          guest.appendChild(preview);
          guest.appendChild(time);


          guest.addEventListener(
            "click",
            function() {

              openConversation(
                userId
              );

            }
          );


          inbox.appendChild(guest);

        }
      );

    }


    /*
      OPEN ONE GUEST CONVERSATION
    */

    function openConversation(userId) {
selectedGuestId = userId;
      const userMessages =
        allRooms[userId];

      if (!userMessages) {
        return;
      }


      const messages =
        Object.values(userMessages)
          .filter(
            message => message
          )
          .sort(
            (a, b) =>
              (a.timestamp || 0) -
              (b.timestamp || 0)
          );


      inbox.style.display =
        "none";

      conversation.style.display =
        "block";

      backButton.style.display =
        "inline-block";


      conversationMessages.innerHTML =
  "";


      const title =
        document.createElement("div");

      title.className =
        "conversation-title";

      title.textContent =
        "💬 " +
        (messages[0]?.name || "Guest");


      conversationMessages.appendChild(
  title
);


      messages.forEach(
        function(message) {

          const box =
            document.createElement("div");

          box.className =
  message.name === "Admin"
    ? "message admin-message"
    : "message guest-message";


          const name =
            document.createElement("div");

          name.className =
            "name";

          name.textContent =
            message.name ||
            "Guest";


          const guestId =
            document.createElement("div");

          guestId.className =
            "guest-id";

          guestId.textContent =
            "Guest ID: " +
            userId;


          if (message.image) {

  const imageElement =
    document.createElement("img");

  imageElement.src =
    message.image;

  imageElement.style.width =
    "100%";

  imageElement.style.maxWidth =
    "300px";

  imageElement.style.borderRadius =
    "12px";

  imageElement.style.display =
    "block";

  imageElement.style.marginTop =
    "8px";

  box.appendChild(
    imageElement
  );

}

if (message.text) {

  const text =
    document.createElement("div");

  text.className =
    "text";

  text.textContent =
    message.text;

  box.appendChild(
    text
  );

}


          const time =
            document.createElement("div");

          time.className =
            "time";


          if (message.timestamp) {

            time.textContent =
              new Date(
                message.timestamp
              ).toLocaleString();

          }


          box.appendChild(name);
          box.appendChild(guestId);
          box.appendChild(time);


          conversationMessages.appendChild(
  box
);

        }
      );

    }


    /*
      BACK BUTTON
    */

    backButton.addEventListener(
      "click",
      function() {

        showInbox();

      }
    );
if ("Notification" in window) {

  const permission =
    await Notification.requestPermission();

  if (permission === "granted") {
    console.log("Notifications enabled");
  } else {
    console.log("Notifications not allowed");
  }

}
  </script>

</body>
</html>
