<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CPV ADMIN CHAT</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #000;
      color: white;
      font-family: Arial, sans-serif;
    }

    .header {
      padding: 18px;
      text-align: center;
      background: #181818;
      border-bottom: 1px solid #333;
    }

    .header h2 {
      margin: 0;
      color: red;
    }

    .status {
      margin-top: 6px;
      color: #4ade80;
      font-size: 13px;
    }

    .back {
      display: none;
      margin-top: 12px;
      padding: 9px 16px;
      border: none;
      border-radius: 20px;
      background: white;
      color: black;
      font-weight: bold;
      cursor: pointer;
    }

    .inbox {
      max-width: 600px;
      margin: auto;
    }

    .guest {
      padding: 17px;
      border-bottom: 1px solid #292929;
      background: #111;
      cursor: pointer;
    }

    .guest:active {
      background: #222;
    }

    .guest-name {
      color: white;
      font-size: 17px;
      font-weight: bold;
    }

    .preview {
      color: #aaa;
      margin-top: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .guest-time {
      color: #777;
      font-size: 11px;
      margin-top: 5px;
    }

    .conversation {
      display: none;
      max-width: 600px;
      margin: auto;
      padding: 18px;
    }

    .conversation-title {
      padding: 12px 0;
      font-size: 18px;
      font-weight: bold;
      color: #ff3333;
    }

    .message {
      background: #191919;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
    }

    .name {
      color: #ff3333;
      font-weight: bold;
    }

    .guest-id {
      color: #777;
      font-size: 10px;
      margin-top: 3px;
    }

    .time {
      color: #888;
      font-size: 11px;
      margin-top: 6px;
    }

    .text {
      margin-top: 8px;
      font-size: 15px;
      word-wrap: break-word;
    }

    .empty {
      padding: 25px;
      text-align: center;
      color: #777;
    }

    .error {
      color: #ff5555;
      padding: 20px;
    }
  </style>
</head>

<body>

  <div class="header">

    <h2>🔐 CPV ADMIN CHAT</h2>

    <div class="status" id="status">
      ● Connecting...
    </div>

    <button
      class="back"
      id="backButton">
      ← Back to Guests
    </button>

  </div>

  <div
    class="inbox"
    id="inbox">
  </div>

  <div
    class="conversation"
    id="conversation">
  </div>


  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js";

    import {
      getDatabase,
      ref,
      onValue
    } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-database.js";

    import {
      getAuth,
      signInWithEmailAndPassword
    } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js";


    const firebaseConfig = {

      apiKey:
        "AIzaSyDOUfBgQbjhOy025v0CZ4CvwnYG6Y2wYBU",

      authDomain:
        "cpv-private-chat.firebaseapp.com",

      databaseURL:
        "https://cpv-private-chat-default-rtdb.firebaseio.com/",

      projectId:
        "cpv-private-chat",

      storageBucket:
        "cpv-private-chat.firebasestorage.app",

      messagingSenderId:
        "916226104692",

      appId:
        "1:916226104692:web:27be19c8a22df397bd6021",

      measurementId:
        "G-SYWN64JMNH"
    };


    const app =
      initializeApp(firebaseConfig);

    const auth =
      getAuth(app);

    const database =
      getDatabase(app);


    const inbox =
      document.getElementById("inbox");

    const conversation =
      document.getElementById("conversation");

    const status =
      document.getElementById("status");

    const backButton =
      document.getElementById("backButton");


    /*
      ADMIN LOGIN
    */

    try {

      await signInWithEmailAndPassword(
        auth,
        "damilareobidairo@gmail.com",
        "Damkidob"
      );

      status.textContent =
        "● Admin online";

    } catch (error) {

      console.error(
        "Admin login error:",
        error
      );

      status.textContent =
        "● Admin login failed";

      inbox.innerHTML =
        "<div class='error'>" +
        "ADMIN ERROR: " +
        error.message +
        "</div>";

      throw error;
    }


    /*
      READ ALL GUEST ROOMS
    */

    const privateMessagesRef =
      ref(
        database,
        "privateMessages"
      );


    let allRooms = {};


    onValue(
      privateMessagesRef,
      function(snapshot) {

        allRooms =
          snapshot.val() || {};

        showInbox();

      },
      function(error) {

        console.error(
          "Database error:",
          error
        );

        status.textContent =
          "● Database error";

        inbox.innerHTML =
          "<div class='error'>" +
          "DATABASE ERROR: " +
          error.message +
          "</div>";
      }
    );


    /*
      SHOW GUEST LIST
    */

    function showInbox() {

      inbox.style.display =
        "block";

      conversation.style.display =
        "none";

      backButton.style.display =
        "none";

      inbox.innerHTML = "";


      const guestIds =
        Object.keys(allRooms);


      if (guestIds.length === 0) {

        inbox.innerHTML =
          "<div class='empty'>" +
          "No guest messages yet." +
          "</div>";

        return;
      }


      guestIds.forEach(
        function(userId) {

          const userMessages =
            allRooms[userId];

          if (!userMessages) {
            return;
          }


          const messages =
            Object.values(userMessages)
              .filter(
                message => message
              )
              .sort(
                (a, b) =>
                  (a.timestamp || 0) -
                  (b.timestamp || 0)
              );


          if (messages.length === 0) {
            return;
          }


          const lastMessage =
            messages[messages.length - 1];


          const guest =
            document.createElement("div");

          guest.className =
            "guest";


          const name =
            document.createElement("div");

          name.className =
            "guest-name";

          name.textContent =
            lastMessage.name ||
            "Guest";


          const preview =
            document.createElement("div");

          preview.className =
            "preview";

          preview.textContent =
            lastMessage.text ||
            "No message";


          const time =
            document.createElement("div");

          time.className =
            "guest-time";


          if (lastMessage.timestamp) {

            time.textContent =
              new Date(
                lastMessage.timestamp
              ).toLocaleString();

          }


          guest.appendChild(name);
          guest.appendChild(preview);
          guest.appendChild(time);


          guest.addEventListener(
            "click",
            function() {

              openConversation(
                userId
              );

            }
          );


          inbox.appendChild(guest);

        }
      );

    }


    /*
      OPEN ONE GUEST CONVERSATION
    */

    function openConversation(userId) {

      const userMessages =
        allRooms[userId];

      if (!userMessages) {
        return;
      }


      const messages =
        Object.values(userMessages)
          .filter(
            message => message
          )
          .sort(
            (a, b) =>
              (a.timestamp || 0) -
              (b.timestamp || 0)
          );


      inbox.style.display =
        "none";

      conversation.style.display =
        "block";

      backButton.style.display =
        "inline-block";


      conversation.innerHTML =
        "";


      const title =
        document.createElement("div");

      title.className =
        "conversation-title";

      title.textContent =
        "💬 " +
        (messages[0]?.name || "Guest");


      conversation.appendChild(
        title
      );


      messages.forEach(
        function(message) {

          const box =
            document.createElement("div");

          box.className =
            "message";


          const name =
            document.createElement("div");

          name.className =
            "name";

          name.textContent =
            message.name ||
            "Guest";


          const guestId =
            document.createElement("div");

          guestId.className =
            "guest-id";

          guestId.textContent =
            "Guest ID: " +
            userId;


          const text =
            document.createElement("div");

          text.className =
            "text";

          text.textContent =
            message.text ||
            "";


          const time =
            document.createElement("div");

          time.className =
            "time";


          if (message.timestamp) {

            time.textContent =
              new Date(
                message.timestamp
              ).toLocaleString();

          }


          box.appendChild(name);
          box.appendChild(guestId);
          box.appendChild(text);
          box.appendChild(time);


          conversation.appendChild(
            box
          );

        }
      );

    }


    /*
      BACK BUTTON
    */

    backButton.addEventListener(
      "click",
      function() {

        showInbox();

      }
    );

  </script>

</body>
</html>
