<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CPV ADMIN CHAT</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #000;
      color: white;
      font-family: Arial, sans-serif;
    }

    .header {
      padding: 18px;
      text-align: center;
      background: #181818;
      border-bottom: 1px solid #333;
    }

    .header h2 {
      margin: 0;
      color: red;
    }

    .status {
      margin-top: 6px;
      color: #4ade80;
      font-size: 13px;
    }

    .login {
      max-width: 400px;
      margin: 40px auto;
      padding: 20px;
    }

    .login input {
      width: 100%;
      padding: 13px;
      margin-bottom: 10px;
      border: 1px solid #444;
      border-radius: 8px;
      background: #222;
      color: white;
      font-size: 15px;
    }

    .login button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: white;
      color: black;
      font-weight: bold;
    }

    .back {
      display: none;
      margin-top: 12px;
      padding: 9px 16px;
      border: none;
      border-radius: 20px;
      background: white;
      color: black;
      font-weight: bold;
    }

    .inbox {
      max-width: 600px;
      margin: auto;
    }

    .guest {
      padding: 17px;
      border-bottom: 1px solid #292929;
      background: #111;
      cursor: pointer;
    }

    .guest:active {
      background: #222;
    }

    .guest-name {
      color: white;
      font-size: 17px;
      font-weight: bold;
    }

    .preview {
      color: #aaa;
      margin-top: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .guest-time {
      color: #777;
      font-size: 11px;
      margin-top: 5px;
    }

    /* UNREAD GUEST */

    .guest.unread .guest-name {
      font-weight: 900;
    }

    .guest.unread .preview {
      font-weight: 700;
      color: white;
    }

    .guest.unread .guest-time {
      font-weight: bold;
      color: #aaa;
    }

    .conversation {
      display: none;
      max-width: 600px;
      margin: auto;
      padding: 18px;
    }

    #conversationMessages {
      display: flex;
      flex-direction: column;
    }

    .conversation-title {
      padding: 12px 0;
      font-size: 18px;
      font-weight: bold;
      color: #ff3333;
    }

    .message {
      max-width: 80%;
      background: #191919;
      border: 1px solid #333;
      border-radius: 14px;
      padding: 10px 14px;
      margin-bottom: 10px;
      align-self: flex-start;
    }

    .admin-message {
      margin-left: auto;
      background: #d00000;
      border-color: #d00000;
    }

    .guest-message {
      margin-right: auto;
    }

    .name {
      color: #ff3333;
      font-weight: bold;
    }

    .admin-message .name {
      color: white;
    }

    .guest-id {
      color: #777;
      font-size: 10px;
      margin-top: 3px;
    }

    .time {
      color: #888;
      font-size: 11px;
      margin-top: 6px;
    }

    .text {
      margin-top: 8px;
      font-size: 15px;
      word-wrap: break-word;
    }

    .empty {
      padding: 25px;
      text-align: center;
      color: #777;
    }

    .error {
      color: #ff5555;
      padding: 20px;
    }

    .reply-box {
      display: flex;
      gap: 8px;
      padding: 12px 0;
      position: sticky;
      bottom: 0;
      background: #000;
    }

    .reply-box input[type="text"] {
      flex: 1;
      min-width: 0;
      padding: 13px;
      border: 1px solid #444;
      border-radius: 25px;
      outline: none;
      background: #252525;
      color: white;
      font-size: 15px;
    }

    .reply-box button {
      padding: 0 18px;
      border: none;
      border-radius: 25px;
      background: white;
      color: black;
      font-weight: bold;
    }

    .image-button {
      width: 48px;
      padding: 0 !important;
    }

    .login-error {
      color: #ff5555;
      margin-top: 10px;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <div class="header">

    <h2>🔐 CPV ADMIN CHAT</h2>

    <div class="status" id="status">
      ● Connecting...
    </div>

    <button
      class="back"
      id="backButton">
      ← Back to Guests
    </button>

  </div>


  <div
    class="login"
    id="loginBox">

    <input
      type="email"
      id="emailInput"
      placeholder="Admin email"
      autocomplete="username">

    <input
      type="password"
      id="passwordInput"
      placeholder="Admin password"
      autocomplete="current-password">

    <button id="loginButton">
      Login
    </button>

    <div
      class="login-error"
      id="loginError">
    </div>

  </div>


  <div
    class="inbox"
    id="inbox"
    style="display:none;">
  </div>


  <div
    class="conversation"
    id="conversation">

    <div id="conversationMessages"></div>

    <div class="reply-box">

      <input
        type="file"
        id="imageInput"
        accept="image/*"
        style="display:none;">

      <button
        id="imageButton"
        class="image-button"
        type="button">
        📷
      </button>

      <input
        type="text"
        id="replyInput"
        placeholder="Type a reply..."
        autocomplete="off">

      <button
        id="replyButton"
        type="button">
        Send
      </button>

    </div>

  </div>


  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js";

    import {
      getDatabase,
      ref,
      onValue,
      push
    } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-database.js";

    import {
      getAuth,
      signInWithEmailAndPassword
    } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js";


    // FIREBASE CONFIG

    const firebaseConfig = {

      apiKey:
        "AIzaSyDOUfBgQbjhOy025v0CZ4CvwnYG6Y2wYBU",

      authDomain:
        "cpv-private-chat.firebaseapp.com",

      databaseURL:
        "https://cpv-private-chat-default-rtdb.firebaseio.com/",

      projectId:
        "cpv-private-chat",

      storageBucket:
        "cpv-private-chat.firebasestorage.app",

      messagingSenderId:
        "916226104692",

      appId:
        "1:916226104692:web27be19c8a22df397bd6021",

      measurementId:
        "G-SYWN64JMNH"
    };


    // START FIREBASE

    const app =
      initializeApp(firebaseConfig);

    const auth =
      getAuth(app);

    const database =
      getDatabase(app);


    // HTML ELEMENTS

    const status =
      document.getElementById("status");

    const loginBox =
      document.getElementById("loginBox");

    const loginButton =
      document.getElementById("loginButton");

    const emailInput =
      document.getElementById("emailInput");

    const passwordInput =
      document.getElementById("passwordInput");

    const loginError =
      document.getElementById("loginError");

    const inbox =
      document.getElementById("inbox");

    const conversation =
      document.getElementById("conversation");

    const conversationMessages =
      document.getElementById(
        "conversationMessages"
      );

    const backButton =
      document.getElementById("backButton");

    const replyInput =
      document.getElementById("replyInput");

    const replyButton =
      document.getElementById("replyButton");

    const imageInput =
      document.getElementById("imageInput");

    const imageButton =
      document.getElementById("imageButton");


    // DATABASE

    const privateMessagesRef =
      ref(
        database,
        "privateMessages"
      );


    let allRooms = {};

    let selectedGuestId = null;

    let adminLoggedIn = false;


    /*
      ADMIN LOGIN
    */

    loginButton.addEventListener(
      "click",
      async function() {

        const email =
          emailInput.value.trim();

        const password =
          passwordInput.value;

        if (!email || !password) {

          loginError.textContent =
            "Enter your email and password.";

          return;
        }

        loginError.textContent =
          "";

        status.textContent =
          "● Logging in...";

        try {

          await signInWithEmailAndPassword(
            auth,
            email,
            password
          );

          adminLoggedIn = true;

          loginBox.style.display =
            "none";

          inbox.style.display =
            "block";

          status.textContent =
            "● Admin online";

          startDatabaseListener();

        } catch (error) {

          console.error(
            "Admin login error:",
            error
          );

          status.textContent =
            "● Login failed";

          loginError.textContent =
            error.message;
        }

      }
    );


    /*
      DATABASE LISTENER
    */

    function startDatabaseListener() {

      onValue(
        privateMessagesRef,

        function(snapshot) {

          allRooms =
            snapshot.val() || {};


          /*
            If conversation is open,
            keep it open.
          */

          if (selectedGuestId) {

            renderConversation(
              selectedGuestId
            );

          } else {

            showInbox();

          }

        },

        function(error) {

          console.error(
            "Database error:",
            error
          );

          status.textContent =
            "● Database error";

          inbox.innerHTML =
            "<div class='error'>" +
            "DATABASE ERROR: " +
            error.message +
            "</div>";
        }
      );

    }


    /*
      SHOW GUEST LIST
    */

    function showInbox() {

      inbox.style.display =
        "block";

      conversation.style.display =
        "none";

      backButton.style.display =
        "none";

      inbox.innerHTML =
        "";


      const rooms = [];


      /*
        BUILD ROOM LIST
      */

      Object.keys(allRooms)
        .forEach(
          function(userId) {

            const userMessages =
              allRooms[userId];

            if (!userMessages) {
              return;
            }


            const messages =
              Object.values(userMessages)
                .filter(
                  message => message
                )
                .sort(
                  (a, b) =>
                    (a.timestamp || 0) -
                    (b.timestamp || 0)
                );


            if (messages.length === 0) {
              return;
            }


            /*
              FIND THE REAL GUEST NAME

              Never use Admin as the guest name.
            */

            const guestMessage =
              messages.find(
                message =>
                  message.name !== "Admin"
              );


            const guestName =
              guestMessage?.name ||
              "Guest";


            /*
              LATEST MESSAGE
            */

            const lastMessage =
              messages[
                messages.length - 1
              ];


            /*
              CHECK IF LAST MESSAGE
              CAME FROM GUEST
            */

            const unread =
              lastMessage.name !== "Admin";


            rooms.push({

              userId:
                userId,

              guestName:
                guestName,

              lastMessage:
                lastMessage,

              unread:
                unread,

              lastTimestamp:
                lastMessage.timestamp || 0

            });

          }
        );


      /*
        SORT BY MOST RECENT MESSAGE

        Newest conversation always goes
        to the top.
      */

      rooms.sort(
        function(a, b) {

          return (
            b.lastTimestamp -
            a.lastTimestamp
          );

        }
      );


      if (rooms.length === 0) {

        inbox.innerHTML =
          "<div class='empty'>" +
          "No guest messages yet." +
          "</div>";

        return;
      }


      /*
        DISPLAY ROOMS
      */

      rooms.forEach(
        function(room) {

          const guest =
            document.createElement("div");

          guest.className =
            "guest";


          /*
            UNREAD

            Guest message is bold until
            the conversation is opened.
          */

          if (room.unread) {

            guest.classList.add(
              "unread"
            );

          }


          /*
            GUEST NAME
          */

          const name =
            document.createElement("div");

          name.className =
            "guest-name";

          name.textContent =
            room.guestName;


          /*
            PREVIEW

            Show who sent the latest message.
          */

          const preview =
            document.createElement("div");

          preview.className =
            "preview";


          if (room.lastMessage.name === "Admin") {

            preview.textContent =
              "Admin: " +
              (
                room.lastMessage.text ||
                (
                  room.lastMessage.image
                    ? "📷 Image"
                    : "No message"
                )
              );

          } else {

            preview.textContent =
              room.lastMessage.text ||
              (
                room.lastMessage.image
                  ? "📷 Image"
                  : "No message"
              );

          }


          /*
            TIME
          */

          const time =
            document.createElement("div");

          time.className =
            "guest-time";


          if (room.lastTimestamp) {

            time.textContent =
              new Date(
                room.lastTimestamp
              ).toLocaleString();

          }


          guest.appendChild(
            name
          );

          guest.appendChild(
            preview
          );

          guest.appendChild(
            time
          );


          /*
            OPEN CONVERSATION

            Opening removes the unread
            bold state because the guest
            has now been viewed.
          */

          guest.addEventListener(
            "click",
            function() {

              selectedGuestId =
                room.userId;

              renderConversation(
                room.userId
              );

            }
          );


          inbox.appendChild(
            guest
          );

        }
      );

    }


    /*
      RENDER CURRENT CONVERSATION
    */

    function renderConversation(
      userId
    ) {

      const userMessages =
        allRooms[userId];


      if (!userMessages) {

        selectedGuestId =
          null;

        showInbox();

        return;
      }


      const messages =
        Object.values(userMessages)
          .filter(
            message => message
          )
          .sort(
            (a, b) =>
              (a.timestamp || 0) -
              (b.timestamp || 0)
          );


      inbox.style.display =
        "none";

      conversation.style.display =
        "block";

      backButton.style.display =
        "inline-block";


      conversationMessages.innerHTML =
        "";


      /*
        FIND GUEST NAME

        Always use guest message,
        never Admin.
      */

      const guestMessage =
        messages.find(
          message =>
            message.name !== "Admin"
        );


      const guestName =
        guestMessage?.name ||
        "Guest";


      const title =
        document.createElement("div");

      title.className =
        "conversation-title";

      title.textContent =
        "💬 " +
        guestName;


      conversationMessages.appendChild(
        title
      );


      /*
        DISPLAY MESSAGES
      */

      messages.forEach(
        function(message) {

          const box =
            document.createElement("div");


          box.className =
            message.name === "Admin"
              ? "message admin-message"
              : "message guest-message";


          const name =
            document.createElement("div");

          name.className =
            "name";

          name.textContent =
            message.name ||
            "Guest";


          const guestId =
            document.createElement("div");

          guestId.className =
            "guest-id";

          guestId.textContent =
            "Guest ID: " +
            userId;


          box.appendChild(
            name
          );

          box.appendChild(
            guestId
          );


          /*
            IMAGE
          */

          if (message.image) {

            const image =
              document.createElement("img");

            image.src =
              message.image;

            image.style.width =
              "100%";

            image.style.maxWidth =
              "300px";

            image.style.borderRadius =
              "12px";

            image.style.display =
              "block";

            image.style.marginTop =
              "8px";

            box.appendChild(
              image
            );

          }


          /*
            TEXT
          */

          if (message.text) {

            const text =
              document.createElement("div");

            text.className =
              "text";

            text.textContent =
              message.text;

            box.appendChild(
              text
            );

          }


          /*
            TIME
          */

          const time =
            document.createElement("div");

          time.className =
            "time";


          if (message.timestamp) {

            time.textContent =
              new Date(
                message.timestamp
              ).toLocaleString();

          }


          box.appendChild(
            time
          );


          conversationMessages.appendChild(
            box
          );

        }
      );


      conversation.scrollTop =
        conversation.scrollHeight;

    }


    /*
      SEND TEXT REPLY
    */

    replyButton.addEventListener(
      "click",
      sendReply
    );


    async function sendReply() {

      const text =
        replyInput.value.trim();


      if (!text) {
        return;
      }


      if (!selectedGuestId) {

        alert(
          "Open a guest conversation first."
        );

        return;
      }


      try {

        const guestMessagesRef =
          ref(
            database,
            "privateMessages/" +
            selectedGuestId
          );


        await push(
          guestMessagesRef,
          {
            name: "Admin",
            text: text,
            timestamp: Date.now()
          }
        );


        replyInput.value =
          "";

        replyInput.focus();


      } catch (error) {

        console.error(
          "Reply error:",
          error
        );

        alert(
          "Reply failed: " +
          error.message
        );

      }

    }


    /*
      ENTER TO SEND
    */

    replyInput.addEventListener(
      "keydown",
      function(event) {

        if (
          event.key === "Enter"
        ) {

          event.preventDefault();

          sendReply();

        }

      }
    );


    /*
      IMAGE BUTTON
    */

    imageButton.addEventListener(
      "click",
      function() {

        imageInput.click();

      }
    );


    /*
      SEND IMAGE
    */

    imageInput.addEventListener(
      "change",
      function() {

        const file =
          imageInput.files[0];


        if (!file) {
          return;
        }


        if (
          !file.type.startsWith(
            "image/"
          )
        ) {

          alert(
            "Please select a picture."
          );

          imageInput.value =
            "";

          return;
        }


        if (!selectedGuestId) {

          alert(
            "Open a guest conversation first."
          );

          imageInput.value =
            "";

          return;
        }


        const reader =
          new FileReader();


        reader.onload =
          function(event) {

            const image =
              new Image();


            image.onload =
              async function() {

                const canvas =
                  document.createElement(
                    "canvas"
                  );


                const maxWidth =
                  600;

                const maxHeight =
                  600;


                let width =
                  image.width;

                let height =
                  image.height;


                if (
                  width > maxWidth
                ) {

                  height =
                    height *
                    (
                      maxWidth /
                      width
                    );

                  width =
                    maxWidth;
                }


                if (
                  height > maxHeight
                ) {

                  width =
                    width *
                    (
                      maxHeight /
                      height
                    );

                  height =
                    maxHeight;
                }


                canvas.width =
                  width;

                canvas.height =
                  height;


                const ctx =
                  canvas.getContext(
                    "2d"
                  );


                ctx.drawImage(
                  image,
                  0,
                  0,
                  width,
                  height
                );


                const imageData =
                  canvas.toDataURL(
                    "image/jpeg",
                    0.5
                  );


                try {

                  const guestMessagesRef =
                    ref(
                      database,
                      "privateMessages/" +
                      selectedGuestId
                    );


                  await push(
                    guestMessagesRef,
                    {
                      name: "Admin",
                      image: imageData,
                      timestamp: Date.now()
                    }
                  );


                  imageInput.value =
                    "";

                } catch (error) {

                  console.error(
                    "Image send error:",
                    error
                  );

                  alert(
                    "Picture failed: " +
                    error.message
                  );

                }

              };


            image.src =
              event.target.result;

          };


        reader.readAsDataURL(file);

      }
    );


    /*
      BACK BUTTON
    */

    backButton.addEventListener(
      "click",
      function() {

        selectedGuestId =
          null;

        showInbox();

      }
    );

  </script>

</body>
</html>
